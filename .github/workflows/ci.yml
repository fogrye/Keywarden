# Builds what needs no signing, Keychain or seeded account. KeywardenTests and the UI test stay local
# (CONTRIBUTING.md › Tests), as does install.sh. release.yml runs release.sh on version tags.
name: CI
on:
  push:
    branches: [main]
  pull_request:

# A newer commit replaces checks for the same PR/branch, never a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Identify Rust compiler
        id: rust
        run: echo "fingerprint=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/debug
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-${{ hashFiles('RustIpc/Cargo.toml', 'RustIpc/src/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-
      - run: cargo test --locked --manifest-path RustIpc/Cargo.toml
      # Persist the successful Rust build even if the later Xcode build fails.
      - name: Save Rust cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - run: scripts/third-party-licenses.sh --check
      - run: brew install xcodegen && xcodegen generate
      - run: >
          xcodebuild -project Keywarden.xcodeproj -scheme Keywarden -configuration Debug
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build-for-testing

  # Tag caches are isolated from later tags. Warm Release artifacts on the default
  # branch so release.yml can restore them, without serializing the Debug checks.
  release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Identify Rust compiler
        id: rust
        run: echo "fingerprint=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/release
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-${{ hashFiles('RustIpc/Cargo.toml', 'RustIpc/src/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-release-${{ steps.rust.outputs.fingerprint }}-
      - run: cargo build --locked --release --manifest-path RustIpc/Cargo.toml
      - name: Save Rust cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/release
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # macOS runners have no Docker, so the server-backed Rust test runs here.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Identify Rust compiler
        id: rust
        run: echo "fingerprint=$(rustc -vV | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust cache
        id: cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/debug
          key: cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-${{ hashFiles('RustIpc/Cargo.toml', 'RustIpc/src/**') }}
          restore-keys: |
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-${{ hashFiles('RustIpc/Cargo.lock') }}-
            cargo-v2-${{ runner.os }}-${{ runner.arch }}-debug-${{ steps.rust.outputs.fingerprint }}-
      - run: sudo apt-get install -y zsh && scripts/test-server.sh
      - run: timeout 60 sh -c 'until curl -sf http://127.0.0.1:18088/alive; do sleep 1; done'
      - run: cargo test --locked --manifest-path RustIpc/Cargo.toml e2e -- --ignored
        env:
          BW_E2E_SERVER: http://127.0.0.1:18088
      - name: Save Rust cache
        if: steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target/debug
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
