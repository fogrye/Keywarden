# Builds what needs no signing, Keychain or seeded account. KeywardenTests and the UI test stay local
# (CONTRIBUTING.md › Tests), as does install.sh. release.yml runs release.sh on version tags.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target
          key: cargo-macos-${{ hashFiles('RustIpc/Cargo.lock') }}
      - run: cargo test --locked --manifest-path RustIpc/Cargo.toml
      - run: scripts/third-party-licenses.sh --check
      - run: brew install xcodegen && xcodegen generate
      - run: >
          xcodebuild -project Keywarden.xcodeproj -scheme Keywarden -configuration Debug
          -derivedDataPath .build/xcode CODE_SIGNING_ALLOWED=NO build-for-testing

  # macOS runners have no Docker, so the server-backed Rust test runs here.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RustIpc/target
          key: cargo-linux-${{ hashFiles('RustIpc/Cargo.lock') }}
      - run: sudo apt-get install -y zsh && scripts/test-server.sh
      - run: timeout 60 sh -c 'until curl -sf http://127.0.0.1:18088/alive; do sleep 1; done'
      - run: cargo test --locked --manifest-path RustIpc/Cargo.toml e2e -- --ignored
        env:
          BW_E2E_SERVER: http://127.0.0.1:18088
