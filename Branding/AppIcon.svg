<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Keywarden app icon: a gold key on a teal plate, on the macOS grid (824 px plate in 1024). -->
  <defs>
    <linearGradient id="plate" gradientUnits="userSpaceOnUse" x1="0" y1="100" x2="0" y2="924">
      <stop offset="0" stop-color="#1E7A70"/>
      <stop offset="1" stop-color="#0D3F4A"/>
    </linearGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="300" y1="220" x2="700" y2="820">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="0.5" stop-color="#F2B93B"/>
      <stop offset="1" stop-color="#C98A1B"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <g id="key">
      <path fill-rule="evenodd" d="M512 212 a158 158 0 1 1 0 316 a158 158 0 1 1 0 -316 Z M512 294 a66 66 0 1 0 0 132 a66 66 0 1 0 0 -132 Z"/>
      <rect x="480" y="470" width="64" height="360" rx="18"/>
      <rect x="530" y="690" width="92" height="50" rx="12"/>
      <rect x="530" y="770" width="66" height="50" rx="12"/>
    </g>
  </defs>
  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000" opacity="0.28" filter="url(#blur)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="#FFF" stroke-opacity="0.12" stroke-width="4"/>
  <!-- Shadow, then the key. -->
  <use href="#key" transform="translate(-10 2) rotate(45 512 512)" fill="#000" opacity="0.35" filter="url(#blur)"/>
  <use href="#key" transform="translate(-10 -10) rotate(45 512 512)" fill="url(#gold)"/>
</svg>
